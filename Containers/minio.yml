apiVersion: v1
kind: Pod
metadata:
  creationTimestamp: "2026-11-17T19:35:26Z"
  labels:
    app: shalomantivirus-pod
  name: shalomantivirus-pod
spec:
  containers:
  - image: docker.io/clamav/clamav:latest
    name: shalomantivirus
  - args:
    - server
    - /data
    - --console-address
    - :9001
    env:
    - name: MINIO_ROOT_PASSWORD
      value: adminpassword
    - name: MINIO_SERVER_URL
      value: http://0.0.0.0:9000
    - name: MINIO_BROWSER_REDIRECT_URL
      value: http://0.0.0.0:9001
    - name: MINIO_ROOT_USER
      value: admin
    image: cgr.dev/chainguard/minio:latest
    name: miniostorage
    ports:
    - containerPort: 9000
      hostIP: 0.0.0.0
      hostPort: 9000
    - containerPort: 9001
      hostIP: 0.0.0.0
      hostPort: 9001
    securityContext:
      runAsNonRoot: true
    volumeMounts:
    - mountPath: /data
      name: minio-minio-data-pvc
  volumes:
  - name: minio-minio-data-pvc
    persistentVolumeClaim:
      claimName: minio-minio-data
