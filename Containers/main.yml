services:
  postgresdb:
    image: docker.io/library/postgres:16-alpine
    container_name: postgresdb
    command:
      - postgres
    environment:
      POSTGRES_PASSWORD: "S@ndia1234"
      POSTGRES_USER: Juanxiu
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U Juanxiu -d TorneoCB"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 2G
    volumes:
      - docker-2-postgres-data:/var/lib/postgresql/data

  pgadmin:
    image: docker.io/dpage/pgadmin4:9.17
    container_name: pgadmin
    environment:
      PGADMIN_DEFAULT_PASSWORD: "S@ndia1234"
      PGADMIN_CONFIG_SERVER_MODE: "True"
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
    ports:
      - "30001:80"
    volumes:
      - docker-2-pgadmin-data:/var/lib/pgadmin

  redisinsightpanel:
    image: docker.io/redis/redisinsight:latest
    container_name: redisinsightpanel
    ports:
      - "8002:5540"
    volumes:
      - docker-2-redis-insight-data:/data

  rediscacheserver:
    image: docker.io/library/redis:7.4-alpine
    container_name: rediscacheserver
    command:
      - redis-server
      - --user
      - default
      - "off"
      - --user
      - admin
      - "on"
      - ">AdminCachePass123"
      - "~*"
      - "&*"
      - "+@all"
      - --user
      - cache_user
      - "on"
      - ">UserCachePass123"
      - "~*"
      - "&*"
      - "+@all"
      - --maxmemory
      - 512mb
      - --maxmemory-policy
      - allkeys-lru
      - --appendonly
      - "no"
    ports:
      - "6379:6379"
    volumes:
      - docker-2-redis-cache-data:/data

  redisragserver:
    image: docker.io/redis/redis-stack-server:latest
    container_name: redisragserver
    command:
      - redis-server
      - --protected-mode
      - "no"
      - --user
      - default
      - "off"
      - --user
      - admin
      - "on"
      - ">AdminRagPass123"
      - "~*"
      - "&*"
      - "+@all"
      - --appendonly
      - "yes"
    ports:
      - "6380:6379"
    volumes:
      - docker-2-redis-rag-data:/data

volumes:
  docker-2-postgres-data:
  docker-2-pgadmin-data:
  docker-2-redis-insight-data:
  docker-2-redis-cache-data:
  docker-2-redis-rag-data:
