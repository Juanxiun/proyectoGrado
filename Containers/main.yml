# Save the output of this file and use kubectl create -f to import
# it into Kubernetes.
#
# Created with podman-6.2.0
apiVersion: v1
kind: Pod
metadata:
  creationTimestamp: "2026-11-17T19:34:06Z"
  labels:
    app: postgresdb-pod
  name: postgresdb-pod
spec:
  containers:
  - args:
    - postgres
    env:
    - name: POSTGRES_PASSWORD
      value: S@ndia1234
    - name: POSTGRES_USER
      value: Juanxiu
    image: docker.io/library/postgres:16-alpine
    livenessProbe:
      exec:
        command:
        - /bin/sh
        - -c
        - pg_isready -U Juanxiu -d TorneoCB
      failureThreshold: 5
      periodSeconds: 10
      timeoutSeconds: 5
    name: postgresdb
    ports:
    - containerPort: 5432
      hostPort: 5432
    resources:
      limits:
        cpu: "2"
        memory: 2Gi
    volumeMounts:
    - mountPath: /var/lib/postgresql/data
      name: docker-2-postgres-data-pvc
  - env:
    - name: PGADMIN_DEFAULT_PASSWORD
      value: S@ndia1234
    - name: PGADMIN_CONFIG_SERVER_MODE
      value: "True"
    - name: PGADMIN_DEFAULT_EMAIL
      value: admin@admin.com
    image: docker.io/dpage/pgadmin4:9.17
    name: pgadmin
    ports:
    - containerPort: 80
      hostPort: 30001
    securityContext:
      runAsNonRoot: true
    volumeMounts:
    - mountPath: /var/lib/pgadmin
      name: docker-2-pgadmin-data-pvc
  - image: docker.io/redis/redisinsight:latest
    name: redisinsightpanel
    ports:
    - containerPort: 5540
      hostPort: 8002
    securityContext: {}
    volumeMounts:
    - mountPath: /data
      name: docker-2-redis-insight-data-pvc
  - args:
    - redis-server
    - --user
    - default
    - "off"
    - --user
    - admin
    - "on"
    - '>AdminCachePass123'
    - ~*
    - '&*'
    - +@all
    - --user
    - cache_user
    - "on"
    - '>UserCachePass123'
    - ~*
    - '&*'
    - +@all
    - --maxmemory
    - 512mb
    - --maxmemory-policy
    - allkeys-lru
    - --appendonly
    - "no"
    image: docker.io/library/redis:7.4-alpine
    name: rediscacheserver
    ports:
    - containerPort: 6379
      hostPort: 6379
    volumeMounts:
    - mountPath: /data
      name: docker-2-redis-cache-data-pvc
  - command:
    - redis-server
    - --protected-mode
    - "no"
    - --user
    - default
    - "off"
    - --user
    - admin
    - "on"
    - '>AdminRagPass123'
    - ~*
    - '&*'
    - +@all
    - --appendonly
    - "yes"
    image: docker.io/redis/redis-stack-server:latest
    name: redisragserver
    ports:
    - containerPort: 6379
      hostPort: 6380
    volumeMounts:
    - mountPath: /data
      name: docker-2-redis-rag-data-pvc
  volumes:
  - name: docker-2-postgres-data-pvc
    persistentVolumeClaim:
      claimName: docker-2-postgres-data
  - name: docker-2-pgadmin-data-pvc
    persistentVolumeClaim:
      claimName: docker-2-pgadmin-data
  - name: docker-2-redis-insight-data-pvc
    persistentVolumeClaim:
      claimName: docker-2-redis-insight-data
  - name: docker-2-redis-cache-data-pvc
    persistentVolumeClaim:
      claimName: docker-2-redis-cache-data
  - name: docker-2-redis-rag-data-pvc
    persistentVolumeClaim:
      claimName: docker-2-redis-rag-data
